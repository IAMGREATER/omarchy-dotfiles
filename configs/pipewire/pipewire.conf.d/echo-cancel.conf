# Advanced Acoustic Echo Cancellation (AEC) and Noise Suppression
context.modules = [
    {
        name = libpipewire-module-echo-cancel
        args = {
            # Monitor mode: transparently listen to your active default output (speakers/HDMI)
            # without creating a separate virtual playback sink or breaking audio routes.
            monitor.mode = true

            # WebRTC Audio Processing enhancements
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.transient_suppression = true
                webrtc.voice_detection = true
            }

            source.props = {
                node.name = "echo_cancel_source"
                node.description = "Clean Microphone (Echo-Cancelled)"
                media.class = "Audio/Source"
                priority.driver = 2000
                priority.session = 2000
            }
        }
    }
]
