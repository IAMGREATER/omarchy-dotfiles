# Ensure hardware audio sinks always take driver priority over capture sources,
# and give external HDMI/DisplayPort audio higher session priority than internal
# laptop speakers so HDMI 0 remains the active default across boots and re-plugs.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 500
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 1500
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_output.pci.*HiFi__HDMI2__sink"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 1500
        priority.session = 1550
        api.alsa.use-chmap = false
        session.suspend-timeout-seconds = 0
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_output.pci.*HiFi__HDMI1__sink"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 1500
        priority.session = 1600
        api.alsa.use-chmap = false
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
